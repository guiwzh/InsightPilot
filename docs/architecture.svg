<text x="194" y="648" font-size="12.5" fill="#334155">GET / DELETE /api/conversations</text>
<text x="194" y="667" font-size="12.5" fill="#334155">GET /api/stats · /api/health</text>
<text x="194" y="686" font-size="12.5" fill="#334155">会话按访客隔离，看板全站汇总</text>
