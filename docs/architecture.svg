<text x="194" y="821" font-size="14.5" fill="#b45309" font-weight="bold">run-sql.ts · schema-info.ts</text>
<text x="194" y="843" font-size="12.5" fill="#334155">只读连接执行，最多 1000 行，5 秒超时</text>
<text x="194" y="862" font-size="12.5" fill="#15803d">完整结果存 query_results</text>
<text x="194" y="881" font-size="12.5" fill="#334155">模型只拿列信息和预览（≤ 100 行）</text>
<text x="194" y="900" font-size="12.5" fill="#334155">长文本截断，结果超过 200 万字符拒绝</text>
<text x="194" y="919" font-size="12.5" fill="#334155">表结构和常见取值读自系统目录</text>
<rect x="520" y="796" width="320" height="170" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
<text x="534" y="821" font-size="14.5" fill="#b45309" font-weight="bold">tools.ts · 6 个工具</text>
<text x="534" y="843" font-size="12.5" fill="#334155">list_tables · describe_table</text>
<text x="534" y="862" font-size="12.5" fill="#334155">get_metric_definitions（13 个口径）</text>
<text x="534" y="881" font-size="12.5" fill="#334155">run_sql → sql-guard（AST 白名单）</text>
<text x="534" y="900" font-size="12.5" fill="#334155">render_chart（图表 DSL 校验）</text>
<text x="534" y="919" font-size="12.5" fill="#334155">export_csv（需要用户确认）</text>
<rect x="860" y="796" width="320" height="170" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
<text x="874" y="821" font-size="14.5" fill="#b45309" font-weight="bold">agent.ts · agentSettings</text>
<text x="874" y="843" font-size="12.5" fill="#334155">提示词 + few-shot（开头固定，吃缓存）</text>
<text x="874" y="862" font-size="12.5" fill="#334155">最多 8 步 · 拦截重复 SQL</text>
<text x="874" y="881" font-size="12.5" fill="#334155">最后一步禁用工具，保证有文字回答</text>
<text x="874" y="900" font-size="12.5" fill="#334155">SQL 报错 2 次后换用 Pro 模型</text>
<text x="874" y="919" font-size="12.5" fill="#334155">能力做成开关，评测逐项消融</text>
