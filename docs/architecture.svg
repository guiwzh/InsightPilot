<text x="534" y="603" font-size="12.5" fill="#0f766e">中间件：访客 cookie（所有接口）→ IP 限流 10 次/分钟 + 请求体 ≤ 2MB（对话接口）</text>
<rect x="520" y="624" width="660" height="98" rx="10" fill="#ffffff" stroke="#2dd4bf" stroke-width="1.5"/>
