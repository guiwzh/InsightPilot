<text x="534" y="671" font-size="12.5" fill="#334155">每日预算检查（每个访客 40 万 token · 全站 ¥10）→ 先保存会话</text>
<text x="534" y="690" font-size="12.5" fill="#334155">streamText（Vercel AI SDK 7）：按 agentSettings 多步调用模型和工具</text>
<text x="534" y="709" font-size="12.5" fill="#334155">UI Message Stream（SSE）流式返回 → 结束时保存消息、写 agent_runs</text>
